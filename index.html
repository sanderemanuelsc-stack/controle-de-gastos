<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Gastos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>💰 Controle de Gastos</h1>

    <section class="resumo">
      <div class="card"><span>Receitas</span><strong id="total-receitas" class="verde">R$ 0,00</strong></div>
      <div class="card"><span>Despesas</span><strong id="total-despesas" class="vermelho">R$ 0,00</strong></div>
      <div class="card"><span>Saldo</span><strong id="saldo">R$ 0,00</strong></div>
    </section>

    <section class="painel">
      <h2>Nova transação</h2>
      <form id="form" autocomplete="off">
        <input id="descricao" type="text" placeholder="Descrição" maxlength="60" required>
        <input id="valor" type="number" step="0.01" min="0.01" placeholder="Valor (R$)" required>
        <select id="tipo">
          <option value="despesa">Despesa</option>
          <option value="receita">Receita</option>
        </select>
        <select id="categoria">
          <option>Alimentação</option>
          <option>Transporte</option>
          <option>Lazer</option>
          <option>Estudos</option>
          <option>Saúde</option>
          <option>Outros</option>
        </select>
        <input id="data" type="date" required>
        <button type="submit">Adicionar</button>
      </form>
    </section>

    <section class="painel">
      <h2>Despesas por categoria</h2>
      <div id="grafico"></div>
    </section>

    <section class="painel">
      <div class="topo-lista">
        <h2>Histórico</h2>
        <div>
          <select id="filtro-tipo" aria-label="Filtrar por tipo">
            <option value="todas">Todas</option>
            <option value="receita">Receitas</option>
            <option value="despesa">Despesas</option>
          </select>
          <button id="exportar" type="button">⬇️ Exportar CSV</button>
        </div>
      </div>
      <ul id="lista"></ul>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
